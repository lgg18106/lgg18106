name: Analyze Idealista URL

on:
  push:
    paths:
      - 'piso_finder/data/queue/*.url'
  workflow_dispatch:
    inputs:
      url:
        description: 'URL del anuncio Idealista'
        required: true
      valor_referencia:
        description: 'Valor de Referencia del Catastro (€, opcional)'
        required: false
      days_on_market:
        description: 'Días en portal (opcional)'
        required: false

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'piso_finder/requirements.txt'

      - name: Install dependencies
        working-directory: piso_finder
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Process queue (push trigger)
        if: github.event_name == 'push'
        working-directory: piso_finder
        run: |
          mkdir -p data/analysis
          for f in data/queue/*.url; do
            [ -f "$f" ] || continue
            stem=$(basename "$f" .url)
            url=$(tr -d '[:space:]' < "$f")
            echo "::group::Fetching $url"
            PYTHONPATH=src python -m piso_finder.url_cli "$url" \
              --benchmarks data/benchmarks.yaml \
              --json-out "data/analysis/${stem}.json" || true
            echo "::endgroup::"
            rm -f "$f"
          done

      - name: Process dispatch input
        if: github.event_name == 'workflow_dispatch'
        working-directory: piso_finder
        run: |
          mkdir -p data/analysis
          stem="dispatch-$(date +%s)"
          extra_args=""
          if [ -n "${{ inputs.valor_referencia }}" ]; then
            extra_args="$extra_args --valor-referencia ${{ inputs.valor_referencia }}"
          fi
          if [ -n "${{ inputs.days_on_market }}" ]; then
            extra_args="$extra_args --days-on-market ${{ inputs.days_on_market }}"
          fi
          PYTHONPATH=src python -m piso_finder.url_cli "${{ inputs.url }}" \
            --benchmarks data/benchmarks.yaml \
            $extra_args \
            --json-out "data/analysis/${stem}.json" || true

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add piso_finder/data/analysis piso_finder/data/queue || true
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "analyze: automatic result(s) from workflow"
            git push
          fi

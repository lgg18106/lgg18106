# Benchmarks de mercado Málaga / Costa del Sol — abril 2026
#
# Fuentes que conviene volver a consultar cada trimestre:
#   - Tinsa IMIE:         https://www.tinsa.es/indice-imie/
#   - Notariado:          https://www.notariado.org/portal/estadisticas
#   - Catastro:           https://www.sedecatastro.gob.es (valor de referencia por inmueble)
#   - Idealista evolución: https://www.idealista.com/sala-de-prensa/informes-precio-vivienda/
#   - INE IPV:            https://www.ine.es/
#
# Cada entrada tiene:
#   tinsa_eur_m2            €/m² tasación de operaciones reales (más conservador)
#   notariado_eur_m2        €/m² medio de operaciones notarizadas (real closed price)
#   idealista_eur_m2        €/m² medio de anuncios publicados (precio de oferta)
#   price_change_12m        variación anual (%, decimal)
#   avg_days_on_market      días medios que un anuncio tarda en cerrar
#   commission_embedded     % comisión inmobiliaria típica ya incluida en el anuncio
#
# Regla de uso: el precio de cierre real en España suele moverse entre el Notariado
# (piso) y el Idealista (techo). Si un anuncio está por encima del techo Idealista
# de zona, asume 10-15 % de margen para negociar.


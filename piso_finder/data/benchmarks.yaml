# Parámetros por defecto para cálculo de hipoteca y gastos (Andalucía)
defaults:
  itp_rate: 0.07
  iva_rate_obra_nueva: 0.10
  ajd_rate_obra_nueva: 0.012
  notaria_registro_gestoria: 2500
  tasacion: 400
  mortgage:
    tin_fijo: 0.025
    plazo_anios: 30
    neto_mensual: 2450           # editable — neto real del solicitante
    cuota_max_pct: 0.35          # tope de esfuerzo
    usa_aval_junta: true         # Programa Garantía Vivienda Andalucía

# Descuentos esperables sobre precio de anuncio (multiplicador)
discount_rules:
  obra_nueva: 0.02                # promotoras bajan poco
  segunda_mano_menos_30_dias: 0.04
  segunda_mano_30_90_dias: 0.06
  segunda_mano_90_180_dias: 0.09
  segunda_mano_mas_180_dias: 0.12
  anuncio_con_bajada_visible: 0.05  # extra sobre lo ya rebajado
  herencia_multiples_herederos: 0.12
  particular_sin_agencia: 0.12
  agencia_exclusiva_grande: 0.06
